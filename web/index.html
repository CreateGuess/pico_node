<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XBus 相机监看</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#203049;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;transition:background .15s,box-shadow .15s}button:focus-visible{outline:3px solid #8ab8ff;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.shell{max-width:1600px;margin:auto;padding:36px 40px 28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:14px}.brand-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#2463eb;color:white;box-shadow:0 5px 12px #2463eb20}svg{display:block;width:24px;height:24px}h1{margin:0;font-size:25px;letter-spacing:-.6px;font-weight:700}.subtitle{margin:6px 0 0;color:#778398;font-size:13px}.actions{display:flex;gap:10px}.button{padding:10px 16px;border:1px solid #dbe2ed;border-radius:9px;background:#fff;color:#40516b;font-size:13px;font-weight:600}.button:hover{background:#f5f8fc}.button.primary{background:#2463eb;border-color:#2463eb;color:#fff}.button.primary:hover{background:#1c52cc}.overview{display:flex;align-items:center;gap:28px;margin:28px 0 22px;padding:17px 22px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;font-size:13px;color:#718097}.metric{display:flex;align-items:center;gap:9px}.metric strong{font-size:19px;color:#24364e;font-variant-numeric:tabular-nums}.overview-note{margin-left:auto;display:flex;gap:7px;align-items:center;font-size:12px}.dot{width:7px;height:7px;display:inline-block;flex-shrink:0;border-radius:50%;background:#9aa8bc}.dot.green{background:#16a579}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.grid.single{grid-template-columns:minmax(0,1fr);max-width:1100px;margin:auto}.camera{min-width:0;border:1px solid #dfe6ef;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 3px 12px #20304904}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px}.camera-name{display:flex;align-items:center;gap:10px;min-width:0}.camera-index{display:grid;place-items:center;width:29px;height:29px;background:#eff4fc;color:#6280a6;border-radius:8px;font:600 12px ui-monospace,monospace;flex-shrink:0}h2{font-size:14px;font-weight:650;margin:0;overflow-wrap:anywhere}.badge{white-space:nowrap;font-size:11px;padding:5px 8px;border-radius:5px;background:#f0f3f7;color:#7b899d;display:flex;align-items:center;gap:5px}.badge.live{background:#eaf8f1;color:#228160}.stage{position:relative;aspect-ratio:16/9;background:#eaf0f6;overflow:hidden}.stage video{width:100%;height:100%;display:block;object-fit:contain;background:#172231}.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#edf2f8,#e5edf5);color:#8a9cb3;pointer-events:none}.empty svg{width:38px;height:38px;stroke-width:1.3}.empty span{font-size:12px}.empty[hidden]{display:none}.fps{position:absolute;left:12px;top:12px;border:1px solid #ffffff45;padding:5px 9px;border-radius:6px;color:#fff;background:#203049a8;font:500 11px ui-monospace,monospace;font-variant-numeric:tabular-nums;pointer-events:none}.fullscreen{position:absolute;right:10px;bottom:10px;border:1px solid #ffffff45;border-radius:6px;background:#203049a8;color:#fff;padding:7px}.fullscreen svg{width:16px;height:16px}.stage:fullscreen{background:#172231;aspect-ratio:auto}.card-stats{display:flex;gap:20px;padding:15px 20px;border-bottom:1px solid #edf1f6;font-size:11px;color:#8a97a9}.card-stats strong{margin-left:6px;font-size:12px;font-weight:600;color:#40516b;font-variant-numeric:tabular-nums}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px}.connection{font-size:12px;color:#7a889c;overflow-wrap:anywhere}.connection.error{color:#c34d4d}.card-buttons{display:flex;gap:8px;flex-shrink:0}.card-buttons .button{padding:7px 12px;font-size:12px}.card-buttons .connect{color:#2463eb;border-color:#dbe7ff;background:#f4f8ff}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:23px;color:#91a0b3;font-size:11px}.banner{padding:12px 16px;border:1px solid #f1d7bc;background:#fff7ec;color:#a36929;border-radius:9px;font-size:13px;margin-bottom:18px}.loading{grid-column:1/-1;padding:80px 20px;text-align:center;color:#8b9ab0;border:1px dashed #d3ddea;border-radius:14px;font-size:14px}@media(min-width:1400px){.grid.many{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.shell{padding:24px 16px}.topbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .button{flex:1}.overview{gap:16px;padding:14px;flex-wrap:wrap}.overview-note{margin-left:0;width:100%}.grid{grid-template-columns:minmax(0,1fr)}.card-head{padding:14px}.card-stats{gap:14px;padding:13px 14px}.card-foot{padding:12px 14px}.footer{flex-direction:column}.metric strong{font-size:17px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg></div><div><h1>相机监看</h1><p class="subtitle">XBus · 多路实时视频</p></div></div><div class="actions"><button class="button" id="stop-all">全部断开</button><button class="button primary" id="start-all">全部连接</button></div></header>
<section class="overview" aria-label="相机概况"><div class="metric">已配置相机 <strong id="total">0</strong></div><div class="metric">图源在线 <strong id="sources">0</strong></div><div class="metric">本页播放 <strong id="playing">0</strong></div><div class="overview-note"><span class="dot" id="service-dot"></span><span id="service-status" role="status">正在读取相机配置</span></div></section>
<div class="banner" id="banner" role="alert" hidden></div>
<section class="grid" id="cameras" aria-label="实时视频"><div class="loading">正在加载相机列表…</div></section>
<footer class="footer"><span>H.264 硬件编码 · WebRTC 传输</span><span>帧率以浏览器实际呈现为准 · 状态每 2 秒更新</span></footer>
</main>
<script>
const grid=document.querySelector('#cameras'),cameras=new Map();
const cameraIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>';
const tasks=[];let activeTasks=0,autoConnect=true;

/** @brief 更新本页实际播放数，区别于服务端全部观看会话数。 */
function updatePlaying(){document.querySelector('#playing').textContent=[...cameras.values()].filter(c=>c.state==='playing').length;}

/** @brief 停止指定视频的帧率采样，清理旧会话回调与定时器。 */
function stopFps(camera){
 ++camera.fpsGeneration;
 if(camera.frameCallback!==null)camera.video.cancelVideoFrameCallback?.(camera.frameCallback);
 camera.frameCallback=null;clearInterval(camera.fpsTimer);camera.fpsTimer=null;camera.fps.textContent='0.0 FPS';
}

/** @brief 独立统计每路浏览器呈现帧率，停更显示零，重连重新计数。 */
function startFps(camera){
 // 1. 先清除旧采样，避免重连后同时运行多个统计任务。
 stopFps(camera);
 const video=camera.video,generation=camera.fpsGeneration;
 let frames=0,lastFrames=0,lastTime=performance.now(),previous=null;
 const useCallback=typeof video.requestVideoFrameCallback==='function';
 const rendered=()=>{const q=video.getVideoPlaybackQuality();return q.totalVideoFrames-q.droppedVideoFrames;};
 // 2. 优先使用呈现回调，兼容浏览器回退到播放质量计数。
 if(useCallback){
  const count=(_now,metadata)=>{
   if(generation!==camera.fpsGeneration)return;
   frames+=previous===null?1:Math.max(0,metadata.presentedFrames-previous);previous=metadata.presentedFrames;
   camera.frameCallback=video.requestVideoFrameCallback(count);
  };
  camera.frameCallback=video.requestVideoFrameCallback(count);
 }else if(typeof video.getVideoPlaybackQuality==='function')lastFrames=rendered();
 else{camera.fps.textContent='FPS 暂不支持';return;}
 // 3. 使用实际采样时长，避免页面繁忙或进入后台后误报帧率。
 camera.fpsTimer=setInterval(()=>{
  const now=performance.now(),current=useCallback?frames:rendered();
  camera.fps.textContent=`${(Math.max(0,current-lastFrames)*1000/(now-lastTime)).toFixed(1)} FPS`;
  lastFrames=current;lastTime=now;
 },1000);
}

/** @brief 通过会话标识释放服务端连接，忽略页面关闭时的网络错误。 */
function deleteSession(id){if(id)fetch('/session/'+encodeURIComponent(id),{method:'DELETE',keepalive:true}).catch(()=>{});}

/** @brief 断开单路视频并使旧协商结果失效，不影响其他相机。 */
function disconnect(camera,message='已断开',error=false){
 // 1. 先更新代次，使关闭连接产生的事件与旧异步响应立即失效。
 ++camera.generation;clearTimeout(camera.deadline);camera.abort?.abort();camera.abort=null;
 deleteSession(camera.session);camera.session=null;
 const old=camera.peer;camera.peer=null;old?.close();stopFps(camera);
 // 2. 复位当前卡片，保留 topic 标题和接收统计。
 camera.video.srcObject=null;camera.empty.hidden=false;camera.placeholder.textContent='连接后显示实时画面';
 camera.connect.disabled=false;camera.stop.disabled=true;camera.state=error?'error':'idle';
 camera.status.textContent=message;camera.status.classList.toggle('error',error);updatePlaying();
}

/** @brief 创建一张相机卡片，所有 topic 名称均作为文本插入页面。 */
function createCamera(topic,index){
 const card=document.createElement('article');card.className='camera';
 card.innerHTML=`<div class="card-head"><div class="camera-name"><span class="camera-index"></span><h2></h2></div><span class="badge"><span class="dot"></span><span class="source-text">等待数据</span></span></div><div class="stage"><video autoplay playsinline muted controls></video><div class="empty">${cameraIcon}<span>连接后显示实时画面</span></div><div class="fps" aria-label="播放帧率">0.0 FPS</div><button class="fullscreen" aria-label="全屏显示视频"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div><div class="card-stats"><span>接收帧数<strong class="received">0</strong></span><span>无效消息<strong class="invalid">0</strong></span><span>观看会话<strong class="peers">0</strong></span></div><div class="card-foot"><span class="connection" role="status">等待连接</span><div class="card-buttons"><button class="button connect">连接</button><button class="button stop" disabled>断开</button></div></div>`;
 card.querySelector('h2').textContent=topic;card.querySelector('h2').title=topic;
 card.querySelector('.camera-index').textContent=String(index+1).padStart(2,'0');
 const camera={topic,card,peer:null,abort:null,session:null,generation:0,fpsGeneration:0,frameCallback:null,fpsTimer:null,deadline:null,state:'idle'};
 for(const [key,selector] of Object.entries({video:'video',fps:'.fps',empty:'.empty',placeholder:'.empty span',connect:'.connect',stop:'.stop',status:'.connection'}))camera[key]=card.querySelector(selector);
 camera.connect.onclick=()=>requestConnect(camera);camera.stop.onclick=()=>disconnect(camera);
 card.querySelector('.fullscreen').onclick=()=>{const stage=card.querySelector('.stage');if(document.fullscreenElement===stage)document.exitFullscreen?.();else stage.requestFullscreen?.().catch(()=>{});};
 grid.append(card);return camera;
}

/** @brief 等待当前连接收齐 ICE 候选；取消时终止等待并移除监听器。 */
function waitForIce(pc,signal){
 return new Promise((resolve,reject)=>{
  const cleanup=()=>{pc.removeEventListener('icegatheringstatechange',changed);signal.removeEventListener('abort',cancelled);};
  const changed=()=>{if(pc.iceGatheringState==='complete'){cleanup();resolve();}};
  const cancelled=()=>{cleanup();reject(new Error('连接已取消'));};
  pc.addEventListener('icegatheringstatechange',changed);signal.addEventListener('abort',cancelled,{once:true});
  if(signal.aborted)cancelled();else changed();
 });
}

/** @brief 为指定 topic 协商独立的视频接收通道，并清理取消后才到达的应答。 */
async function connectCamera(camera,generation){
 if(generation!==camera.generation)return;
 let pc;
 try{
  // 1. 每张卡片创建独立连接，协商、帧率和超时状态互不共享。
  pc=new RTCPeerConnection({iceServers:[]});camera.peer=pc;camera.abort=new AbortController();
  const signal=camera.abort.signal;camera.status.textContent='正在连接…';
  camera.deadline=setTimeout(()=>{if(camera.peer===pc)disconnect(camera,'连接超时，请重试',true);},30000);
  pc.ontrack=e=>{
   if(camera.peer!==pc)return;
   camera.video.srcObject=new MediaStream([e.track]);startFps(camera);
   camera.video.onplaying=()=>{if(camera.peer===pc){camera.empty.hidden=true;camera.state='playing';camera.status.textContent='正在播放';updatePlaying();}};
   camera.video.play().catch(()=>{});
  };
  pc.onconnectionstatechange=()=>{
   if(camera.peer!==pc)return;
   if(pc.connectionState==='connected'){clearTimeout(camera.deadline);camera.status.textContent='已连接';}
   if(['failed','disconnected','closed'].includes(pc.connectionState))disconnect(camera,'连接已断开，请重试',true);
  };
  // 2. 只声明 H.264 接收能力，请求中明确传入对应 topic。
  const transceiver=pc.addTransceiver('video',{direction:'recvonly'});
  if(transceiver.setCodecPreferences && RTCRtpReceiver.getCapabilities){
   const codecs=RTCRtpReceiver.getCapabilities('video').codecs.filter(c=>c.mimeType.toLowerCase()===('video/'+camera.codec.toLowerCase()));
   if(!codecs.length)throw new Error('当前浏览器不支持所配置的视频编码');
   transceiver.setCodecPreferences(codecs);
  }
  await pc.setLocalDescription(await pc.createOffer());await waitForIce(pc,signal);
  const response=await fetch('/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:pc.localDescription.type,sdp:pc.localDescription.sdp,topic:camera.topic}),signal});
  if(!response.ok)throw new Error(await response.text());
  const answer=await response.json();
  // 3. 旧应答不能覆盖重连后的会话；主动删除其服务端资源。
  if(generation!==camera.generation){deleteSession(answer.id);return;}
  camera.session=answer.id;await pc.setRemoteDescription({type:answer.type,sdp:answer.sdp});
 }catch(error){if(generation===camera.generation)disconnect(camera,'连接失败：'+error.message,true);}
}

/** @brief 限制同时进行的 SDP 协商数量，避免多路视频挤占状态请求。 */
function pumpConnections(){
 while(activeTasks<2 && tasks.length){
  const {camera,generation}=tasks.shift();if(generation!==camera.generation)continue;
  ++activeTasks;connectCamera(camera,generation).finally(()=>{--activeTasks;pumpConnections();});
 }
}

/** @brief 排队连接单路视频，重复点击会取消旧任务并以新任务替换。 */
function requestConnect(camera){
 disconnect(camera);camera.state='connecting';camera.status.textContent='等待连接…';camera.placeholder.textContent='正在建立视频连接';
 camera.connect.disabled=true;camera.stop.disabled=false;
 tasks.push({camera,generation:camera.generation});pumpConnections();
}

/** @brief 拉取全部 topic 的状态，生成卡片并逐路更新图源和接收统计。 */
async function refreshStatus(){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),5000);
 try{
  // 1. 使用服务端列表作为显示来源，未推送图像的话题也保留卡片。
  const response=await fetch('/api/status',{signal:controller.signal,cache:'no-store'});
  if(!response.ok)throw new Error('状态接口返回 '+response.status);
  const data=await response.json();if(!Array.isArray(data.cameras))throw new Error('相机列表格式错误');
  if(!cameras.size)grid.replaceChildren();
  const configured=new Set(data.cameras.map(s=>s.topic)),created=[];
  for(const [topic,camera] of cameras)if(!configured.has(topic)){disconnect(camera);camera.card.remove();cameras.delete(topic);}
  for(const [index,snapshot] of data.cameras.entries()){
   if(!cameras.has(snapshot.topic)){const camera=createCamera(snapshot.topic,index);cameras.set(snapshot.topic,camera);created.push(camera);}
   const camera=cameras.get(snapshot.topic),card=camera.card;
   camera.codec=snapshot.codec;
   const sampleTime=performance.now(),previous=camera.serverSample;
   if(previous){
    const seconds=(sampleTime-previous.time)/1000;
    console.info('[服务端 FPS]',{topic:camera.topic,receive_fps:(snapshot.received-previous.received)/seconds,encoded_fps:(snapshot.encoded_frames-previous.encoded)/seconds});
   }
   camera.serverSample={time:sampleTime,received:snapshot.received,encoded:snapshot.encoded_frames};
   card.querySelector('.received').textContent=Number(snapshot.received).toLocaleString();
   card.querySelector('.invalid').textContent=Number(snapshot.invalid).toLocaleString();
   card.querySelector('.peers').textContent=snapshot.peers;
   card.querySelector('.badge').classList.toggle('live',snapshot.source_alive);
   card.querySelector('.badge .dot').classList.toggle('green',snapshot.source_alive);
   card.querySelector('.source-text').textContent=snapshot.source_alive?'图源在线':'等待数据';
   if(snapshot.encoder_failed){disconnect(camera,'编码异常，请检查服务端日志',true);const position=created.indexOf(camera);if(position>=0)created.splice(position,1);}
  }
  // 2. 更新概况；首次加载和新增话题自动播放，用户仍可逐路暂停。
  grid.classList.toggle('single',cameras.size===1);grid.classList.toggle('many',cameras.size>4);
  document.querySelector('#total').textContent=cameras.size;
  document.querySelector('#sources').textContent=data.cameras.filter(s=>s.source_alive).length;
  document.querySelector('#service-status').textContent='服务已连接';document.querySelector('#service-dot').classList.add('green');
  document.querySelector('#banner').hidden=true;
  if(autoConnect)created.forEach(requestConnect);
 }catch(error){
  document.querySelector('#service-status').textContent='状态更新失败';document.querySelector('#service-dot').classList.remove('green');
  const banner=document.querySelector('#banner');banner.textContent='暂时无法读取相机状态，将自动重试。'+(error.name==='AbortError'?'请求超时':error.message);banner.hidden=false;
 }finally{clearTimeout(timeout);setTimeout(refreshStatus,2000);}
}

document.querySelector('#start-all').onclick=()=>{autoConnect=true;for(const camera of cameras.values())if(!['playing','connecting'].includes(camera.state))requestConnect(camera);};
document.querySelector('#stop-all').onclick=()=>{autoConnect=false;for(const camera of cameras.values())disconnect(camera);};
window.addEventListener('pagehide',()=>{autoConnect=false;for(const camera of cameras.values())disconnect(camera);});
/** @brief 每秒读取浏览器累计计数，按实际间隔打印接收、解码和丢帧统计。 */
async function logBrowserFps(){
 try{
  for(const camera of cameras.values()){
   const peer=camera.peer;
   if(!peer){camera.browserSample=null;continue;}
   try{
    const stats=await peer.getStats();
    if(camera.peer!==peer)continue;
    stats.forEach(report=>{
     if(report.type!=='inbound-rtp'||(report.kind||report.mediaType)!=='video')return;
     const previous=camera.browserSample;
     if(previous&&previous.peer===peer&&previous.id===report.id&&report.timestamp>previous.timestamp){
      const seconds=(report.timestamp-previous.timestamp)/1000;
      const rate=key=>Number.isFinite(report[key])&&Number.isFinite(previous[key])?(report[key]-previous[key])/seconds:null;
      console.info('[浏览器 FPS]',{topic:camera.topic,receive_fps:rate('framesReceived'),decode_fps:rate('framesDecoded'),dropped_fps:rate('framesDropped'),packets_lost:report.packetsLost,jitter_seconds:report.jitter});
     }
     camera.browserSample={peer,id:report.id,timestamp:report.timestamp,framesReceived:report.framesReceived,framesDecoded:report.framesDecoded,framesDropped:report.framesDropped};
    });
   }catch(error){console.debug('帧率统计暂不可用',camera.topic,error.message);}
  }
 }finally{setTimeout(logBrowserFps,1000);}
}
logBrowserFps();
refreshStatus();
</script>
</body>
</html>
